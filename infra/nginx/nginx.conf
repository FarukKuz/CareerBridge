server {
    listen              443 ssl;
    server_name         careerorbridge.com;

    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root                /usr/share/nginx/html;
    index               index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # 2. BACKEND API (Reverse Proxy)
    # --------------------------------------------------------
    
    location /api/ {
        proxy_pass http://ingestion-service:8080;

        # WebSocket ve Header Ayarları (Canlı veri için kritik)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Gerçek IP adreslerini iletmek için
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP'den HTTPS'e Yönlendirme (Olduğu gibi kalıyor)
server {
    listen      80;
    server_name careerorbridge.com;
    return      301 https://$host$request_uri;
}