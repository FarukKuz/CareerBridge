global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape cadvisor for container metrics (if added later) or services if they expose metrics
  # For now, just placeholder or basic setup
  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['ingestion-service:8080']
